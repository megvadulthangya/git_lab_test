name: Manjaro Repo Smart Builder (Python)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System preparation (pacman keys, essential packages)
        run: |
          set -eux
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            git rsync openssh base-devel jq sudo \
            curl wget ca-certificates \
            appstream appstream-glib \
            meson ninja cmake \
            python python-pip \
            gtk-doc docbook-xsl libxslt \
            gobject-introspection \
            autoconf automake libtool pkg-config \
            patch make gcc binutils \
            file which tar gzip bzip2 xz zstd \
            unzip p7zip gnupg \
            dbus polkit \
            systemd systemd-sysvcompat \
            pacman-contrib arch-install-scripts \
            shellcheck

          # create builder user (same pattern as existing workflows)
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # relax git safe directory (required inside container volumes)
          git config --system --add safe.directory '*'
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1

          # optimize makepkg compression + disable debug option
          sed -i '/^OPTIONS=/ s/ debug/ !debug/' /etc/makepkg.conf || true
          sed -i "s/^COMPRESSZST=.*/COMPRESSZST=(zstd -c -T0 --ultra -20 -)/" /etc/makepkg.conf || true

          # fix permissions so builder can read repo tree
          chown -R builder:builder .

      - name: Setup SSH for builder
        run: |
          mkdir -p /home/builder/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> /home/builder/.ssh/known_hosts || true
          ssh-keyscan -H github.com >> /home/builder/.ssh/known_hosts || true
          chown -R builder:builder /home/builder/.ssh
        env:
          # secrets injected by Actions
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Ensure script executable
        run: |
          chmod +x ./builder.py
          chown builder:builder ./builder.py

      - name: Run builder.py as builder
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REMOTE_DIR: /var/www/repo
          REPO_DB_NAME: manjaro-awesome
          SSH_REPO_URL: git@github.com:megvadulthangya/manjaro-awesome.git
          ADD_CUSTOM_REPO: "true"
          CUSTOM_REPO_SERVER: "http://your.custom.repo/$arch"
        run: |
          su builder -c "python3 ./builder.py"
